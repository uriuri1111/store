<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת תת דומיין</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 40px 50px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 10px; color: #16a34a; }
    p { margin: 0; font-size: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>התת דומיין עובד! ✅</h1>
    <p>הדף הזה נטען בהצלחה.</p>
  </div>
</body>
</html>
