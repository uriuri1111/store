<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>בת המצווה של יעל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Secular+One&display=swap">
<style>
  /* Concept: a night-time party stage framed by a quiet, soft UI. All the colour lives on the stage; panels stay calm. */
  :root {
    --bg: #eef0fa;
    --surface: #ffffff;
    --surface-2: #f4f5fc;
    --ink: #1a1733;
    --muted: #5d5a7c;
    --line: #dcdff0;
    --accent: #d11a67;
    --accent-ink: #ffffff;
    --gold: #f5b301;
    --good: #12805c;
    --bad: #c42b2b;
    --shadow: 0 1px 0 rgba(26, 23, 51, .04), 0 18px 40px -22px rgba(40, 30, 110, .35);
    --font-body: "Heebo", "Segoe UI", Arial, sans-serif;
    --font-display: "Secular One", "Heebo", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0c26; --surface: #1a1740; --surface-2: #231f52; --ink: #f2effd; --muted: #aba6d2; --line: #342f6c;
      --accent: #ff5a98; --accent-ink: #25041b; --gold: #ffc83d; --good: #4fd6a2; --bad: #ff7a7a;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 18px 40px -22px rgba(0, 0, 0, .8); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0c26; --surface: #1a1740; --surface-2: #231f52; --ink: #f2effd; --muted: #aba6d2; --line: #342f6c;
    --accent: #ff5a98; --accent-ink: #25041b; --gold: #ffc83d; --good: #4fd6a2; --bad: #ff7a7a;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 18px 40px -22px rgba(0, 0, 0, .8); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background:
      radial-gradient(800px 420px at 92% -8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 65%),
      radial-gradient(700px 480px at -8% 12%, color-mix(in srgb, #3ddcc2 18%, transparent), transparent 65%),
      var(--bg);
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-block: 22px 34px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1060px; margin: 0 auto; display: grid; gap: 20px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
  .eyebrow { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 7vw, 58px); line-height: 1.02; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); margin: 8px 0 0; max-width: 54ch; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: 99px; background: var(--surface); color: var(--good); box-shadow: var(--shadow); white-space: nowrap; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.8s ease-in-out infinite; }
  .chip.closed { color: var(--bad); }
  .chip.closed::before { animation: none; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }

  .banner { display: none; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 20px; background: linear-gradient(120deg, #ffd34d, #ffb02e); color: #2a1d00; box-shadow: var(--shadow); }
  .banner.on { display: flex; }
  .banner svg { flex: none; width: 46px; height: 46px; }
  .banner .big { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(20px, 4.4vw, 30px); line-height: 1.12; overflow-wrap: anywhere; }
  .banner small { display: block; font-weight: 600; opacity: .8; font-size: 13.5px; }

  .main { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } .stage { max-width: 480px; margin-inline: auto; width: 100%; } }
  .stage { display: grid; gap: 12px; }

  .canvaswrap { position: relative; border-radius: 26px; overflow: hidden; background: #0f0b2e; box-shadow: 0 30px 60px -30px rgba(60, 20, 140, .7), 0 0 0 1px rgba(255, 255, 255, .06); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 3; touch-action: none; direction: ltr; }

  .hudbar { position: absolute; inset: 0 0 auto 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 14px 16px 30px; pointer-events: none; color: #fff; background: linear-gradient(to bottom, rgba(8, 4, 30, .78), rgba(8, 4, 30, 0)); }
  .hs small, .ht small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: rgba(255, 255, 255, .65); }
  .hs b { font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 14px rgba(255, 90, 160, .55); }
  .hc { display: grid; justify-items: center; gap: 5px; padding-top: 2px; }
  .mult { font-family: var(--font-display); font-size: 22px; line-height: 1; color: #ffd34d; text-shadow: 0 0 14px rgba(255, 200, 60, .6); }
  .cbar { width: 64px; height: 6px; border-radius: 9px; background: rgba(255, 255, 255, .18); overflow: hidden; }
  .cbar i { display: block; height: 100%; width: calc(var(--cp, 0) * 100%); background: linear-gradient(90deg, #3ddcc2, #ffd34d); border-radius: 9px; transition: width .12s; }
  .ht { text-align: left; }
  .ht b { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .ht.warn b { color: #ff8a8a; }
  .hh { position: absolute; inset: auto 0 6px 0; display: flex; justify-content: center; gap: 5px; font-size: 20px; line-height: 1; color: #ff5a8a; text-shadow: 0 0 12px rgba(255, 70, 130, .7); }
  .hh .off { color: rgba(255, 255, 255, .22); text-shadow: none; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(10, 6, 36, .7); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); text-align: center; color: #f6f2ff; }
  .overlay[hidden] { display: none !important; }
  .ovcard { max-width: 380px; }
  .overlay h2 { font-family: var(--font-display); font-weight: 400; font-size: 40px; margin: 0 0 10px; line-height: 1.05; background: linear-gradient(90deg, #ffd34d, #ff6fa8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .overlay p { margin: 6px 0; color: #e6e0ff; }
  .overlay .big { font-family: var(--font-display); font-size: 72px; line-height: 1; color: #fff; margin: 4px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 30px rgba(255, 110, 170, .7); }
  .legend { display: grid; gap: 7px; margin: 14px 0 6px; text-align: right; font-size: 14px; }
  .legend div { display: flex; align-items: center; gap: 10px; }
  .legend i { flex: none; width: 12px; height: 12px; border-radius: 50%; }
  .ovbtn { margin-top: 14px; padding: 13px 34px; font-size: 19px; border: 0; border-radius: 99px; color: #25041b; background: linear-gradient(135deg, #ffd34d, #ff6fa8); box-shadow: 0 10px 30px -8px rgba(255, 100, 160, .75); }
  .ovbtn:hover:not(:disabled) { filter: brightness(1.08); }

  button { font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; border-radius: 99px; padding: 10px 18px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); transition: border-color .15s, transform .08s; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { border-color: var(--bad); color: var(--bad); }
  .blast { position: relative; overflow: hidden; width: 100%; padding: 14px 18px; background: var(--surface); box-shadow: var(--shadow); }
  .blast i { position: absolute; inset: 0 0 0 auto; width: calc(var(--p, 0) * 100%); background: linear-gradient(90deg, color-mix(in srgb, #3ddcc2 45%, transparent), color-mix(in srgb, var(--gold) 65%, transparent)); transition: width .15s; }
  .blast span { position: relative; }
  .blast kbd { font-family: inherit; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); margin-inline-start: 6px; }
  .blast.ready { border-color: var(--gold); }
  .row2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; flex: 1 1 200px; }
  #muteBtn { padding: 7px 14px; font-size: 13px; }

  .side { display: grid; gap: 18px; }
  .card { background: var(--surface); border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow); }
  .card h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0 0 12px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label, .field .lbl { font-weight: 800; font-size: 13px; color: var(--muted); }
  input[type="text"] { font-family: inherit; font-size: 16px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatches input { position: absolute; opacity: 0; pointer-events: none; }
  .swatches label { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); transition: transform .1s; }
  .swatches input:checked + label { box-shadow: 0 0 0 3px var(--ink); transform: scale(1.08); }
  .swatches input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 3px; }
  .me { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 24px; color: #1a1733; }
  .nick { font-weight: 800; font-size: 20px; overflow-wrap: anywhere; line-height: 1.2; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stats div { background: var(--surface-2); border-radius: 14px; padding: 10px 14px; }
  .stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; color: var(--muted); }
  .note { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
  .note.warn { color: var(--bad); }

  ol.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ol.board li { display: grid; grid-template-columns: 34px 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; border-radius: 16px; background: linear-gradient(to left, color-mix(in srgb, var(--c, #ff4f93) 26%, transparent) var(--w, 0%), transparent var(--w, 0%)), var(--surface-2); }
  ol.board li.me { box-shadow: inset 0 0 0 2px var(--accent); }
  ol.board .rk { font-family: var(--font-display); font-size: 17px; text-align: center; border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  ol.board li:nth-child(1) .rk { background: linear-gradient(135deg, #ffe27a, #f5a800); color: #3a2600; }
  ol.board li:nth-child(2) .rk { background: linear-gradient(135deg, #f1f3f8, #aeb4c6); color: #2b2f3d; }
  ol.board li:nth-child(3) .rk { background: linear-gradient(135deg, #f0b98a, #b9702f); color: #3a1d06; }
  ol.board .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #1a1733; }
  ol.board .nm { overflow-wrap: anywhere; font-weight: 600; }
  ol.board .sc { font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }
  .empty { display: block !important; color: var(--muted); text-align: center; padding: 18px 10px !important; background: var(--surface-2) !important; }
  .admin { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (prefers-reduced-motion: reduce) { .chip::before { animation: none; } .blast i, .cbar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><span class="dots"><i style="background:#ff4f93"></i><i style="background:#ffc83d"></i><i style="background:#3ddcc2"></i><i style="background:#7c8cff"></i><i style="background:#ff8a3d"></i></span>מרוץ המסיבה</div>
      <h1>בת המצווה של יעל</h1>
      <p class="sub">תפסו ממתקים ומתנות, התחמקו מהפצצות ושברו שיא. 60 שניות לכל משחק, ומי שבראש הטבלה בסוף ניצח.</p>
    </div>
    <div class="chip" id="chip">התחרות פתוחה</div>
  </header>

  <div class="banner" id="banner" role="status">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 6h20v12c0 7-4.5 12-10 12S14 25 14 18V6z" fill="#7a4a00"/><path d="M14 10H7c0 7 3 11 8 12M34 10h7c0 7-3 11-8 12" fill="none" stroke="#7a4a00" stroke-width="3" stroke-linecap="round"/><rect x="21" y="30" width="6" height="7" fill="#7a4a00"/><rect x="15" y="37" width="18" height="5" rx="2" fill="#7a4a00"/></svg>
    <div><span class="big" id="bannerBig"></span><small id="bannerSmall"></small></div>
  </div>

  <div class="main">
    <section class="stage" aria-label="המשחק">
      <div class="canvaswrap">
        <canvas id="cv" aria-label="מסך המשחק"></canvas>
        <div class="hudbar" aria-live="off">
          <div class="hs"><small>ניקוד</small><b id="hScore">0</b></div>
          <div class="hc"><span class="mult" id="hCombo">x1</span><div class="cbar"><i id="cFill"></i></div></div>
          <div class="ht" id="hTimeBox"><small>שניות</small><b id="hTime">60</b></div>
        </div>
        <div class="hh" id="hHearts" aria-label="חיים"></div>
        <div class="overlay" id="ov">
          <div class="ovcard">
            <h2 id="ovTitle">מוכנים?</h2>
            <div id="ovBody"></div>
            <button class="ovbtn" id="ovBtn">התחל</button>
          </div>
        </div>
      </div>
      <button class="blast" id="blast" disabled><i></i><span>פיצוץ קונפטי<kbd>רווח</kbd></span></button>
      <div class="row2">
        <p class="hint">הזיזו את המגש עם העכבר, האצבע או החצים.</p>
        <button id="muteBtn" aria-pressed="false">צליל: פעיל</button>
      </div>
    </section>

    <div class="side">
      <section class="card" id="acct" aria-label="החשבון שלי"></section>
      <section class="card" aria-label="טבלת הניקוד">
        <h2>טבלת הניקוד</h2>
        <div id="boardMsg" class="note"></div>
        <ol class="board" id="board"></ol>
      </section>
      <section class="card" id="adminCard" hidden aria-label="ניהול התחרות">
        <h2>ניהול התחרות</h2>
        <p class="note">הכפתורים האלה מופיעים רק לבעלי הדף.</p>
        <div class="admin">
          <button class="primary" id="btnClose">סגירה והכרזת זוכה</button>
          <button id="btnOpen">פתיחה מחדש</button>
          <button class="danger" id="btnReset">איפוס ציונים</button>
        </div>
        <p class="note" id="adminMsg" style="margin:10px 0 0"></p>
      </section>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  var PALETTE = ['#ff4f93', '#ffc83d', '#3ddcc2', '#7c8cff', '#ff8a3d', '#9be15d'];
  function colorOf(c) { return PALETTE.indexOf(c) >= 0 ? c : PALETTE[0]; }
  function initial(n) { var a = Array.from(String(n || '?')); return a.length ? a[0] : '?'; }
  function rgba(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }

  /* ---------- backend state ---------- */
  var app = {
    db: null, user: null, uid: null, isOwner: false, canWrite: null,
    players: [], mine: null, mineLoaded: false, contest: { closed: false },
    editing: false, queue: Promise.resolve(), loadTimer: null, acctSig: '', resetArmed: false
  };

  function playerRef() { return app.db.doc('players/' + app.uid); }
  function contestRef() { return app.db.doc('meta/contest'); }
  function sortedPlayers() {
    return app.players.slice().sort(function (a, b) {
      return (b.best || 0) - (a.best || 0) || (a.achievedAt || 0) - (b.achievedAt || 0);
    });
  }
  function canSave() {
    return !!(app.db && app.uid && app.mine && !app.contest.closed && app.canWrite !== false);
  }

  function initBackend() {
    var c = window.claude;
    if (!c || !c.use) { renderAll(); return; }
    var p1 = c.use('user').catch(function () { return null; });
    var p2 = c.use('db').catch(function () { return null; });
    Promise.all([p1, p2]).then(function (r) {
      app.user = r[0]; app.db = r[1];
      var chain = Promise.resolve();
      if (app.user) {
        chain = Promise.all([app.user.id(), app.user.isOwner(), app.user.can('data.write')]).then(function (v) {
          app.uid = v[0]; app.isOwner = v[1]; app.canWrite = v[2];
        }).catch(function () {});
      }
      return chain;
    }).then(function () {
      if (!app.db) { renderAll(); return; }
      app.loadTimer = setTimeout(function () {
        $('boardMsg').textContent = 'הטבלה עדיין לא נטענה. ייתכן שאין חיבור, והנתונים יופיעו כשיחזור.';
      }, 10000);
      var clear = function () { clearTimeout(app.loadTimer); $('boardMsg').textContent = ''; };
      app.db.collection('players').orderBy('best', 'desc').limit(100).onSnapshot(function (snap) {
        app.players = snap.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; });
        if (!snap.metadata.fromCache) clear();
        renderBoard(); renderBanner();
      }, function () { clearTimeout(app.loadTimer); $('boardMsg').textContent = 'אין גישה לטבלה בתצוגה הזו.'; });
      app.db.doc('meta/contest').onSnapshot(function (snap) {
        app.contest = snap.exists ? (snap.data() || { closed: false }) : { closed: false };
        renderBanner(); renderAccount();
      }, function () {});
      if (app.uid) {
        playerRef().onSnapshot(function (snap) {
          app.mineLoaded = true;
          app.mine = snap.exists ? snap.data() : null;
          renderAccount();
        }, function () { app.mineLoaded = true; renderAccount(); });
      }
      renderAll();
    });
  }

  /* ---------- side panels ---------- */
  function renderAll() { renderAccount(); renderBoard(); renderBanner(); }

  function renderBanner() {
    var chip = $('chip'), b = $('banner');
    var closed = !!app.contest.closed;
    chip.textContent = closed ? 'התחרות נסגרה' : 'התחרות פתוחה';
    chip.className = 'chip' + (closed ? ' closed' : '');
    var top = sortedPlayers()[0];
    if (closed && app.contest.winnerNick) {
      $('bannerBig').textContent = 'הזוכה: ' + app.contest.winnerNick;
      $('bannerSmall').textContent = (app.contest.winnerScore || 0) + ' נקודות. כל הכבוד!';
      b.className = 'banner on';
    } else if (top && (top.best || 0) > 0) {
      $('bannerBig').textContent = 'בראש הטבלה: ' + (top.nick || 'שחקן');
      $('bannerSmall').textContent = (top.best || 0) + ' נקודות. עדיין אפשר לעקוף.';
      b.className = 'banner on';
    } else { b.className = 'banner'; }
    $('adminCard').hidden = !(app.isOwner && app.db);
  }

  function renderBoard() {
    var ol = $('board');
    ol.textContent = '';
    if (!app.db) {
      ol.appendChild(el('li', { class: 'empty', text: 'הטבלה זמינה רק כשהדף נפתח דרך Claude.' }));
      return;
    }

    pop(it.x, it.y - 12, '+' + pts, it.type === 'star' ? '#ffd34d' : '#ffffff');
    burst(it.x, it.y, it.type === 'candy' ? it.c : '#ffd34d', it.type === 'star' ? 24 : 10, 160);
    ring(it.x, it.y, it.type === 'candy' ? it.c : '#ffd34d');

  }

  function blast() {

    var m = mult(), gained = 0;
    G.items = G.items.filter(function (it) {

      return true;

    for (var i = 0; i < 70; i++) burst(Math.random() * W, Math.random() * 320, CANDY_COLORS[i % 5], 1, 90);

  function update(dt) {

  /* ---------- drawing ---------- */
