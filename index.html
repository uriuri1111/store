<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ניהול אישורי הגעה</title>
<style>
  html,body{margin:0;height:100%;background:#2e5e4e;color:#fff;font-family:"Assistant","Segoe UI",Arial,sans-serif}
  .box{height:100%;display:grid;place-items:center;text-align:center;padding:20px}
  .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  button{margin-top:14px;font:inherit;font-weight:700;padding:9px 20px;border-radius:8px;border:none;background:#fff;color:#2e5e4e;cursor:pointer}
</style>
</head>
<body>
<div class="box"><div id="msg"><div class="spin"></div>טוען את לוח הניהול</div></div>
<script>
// ===== כתובת הסקריפט של גוגל (מסתיימת ב-/exec). זו השורה היחידה שאולי תצטרכו לשנות =====
const API = 'https://script.google.com/macros/s/AKfycbx9a2GhLO2OHEcQY6_MbSRx0GHobs8zfI9kPGReeEUWV_3tlhYf_Er7BIfPRgE2Nvpc/exec';
// ==========================================================================================
const sys = (new URLSearchParams(location.search).get('sys') || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
fetch(API, { method: 'POST', body: JSON.stringify({ action: 'apiGetUi', args: [sys] }) })
  .then(r => r.json())
  .then(j => {
    if (!j.ok) throw new Error(j.error);
    document.open(); document.write(j.result); document.close();
  })
  .catch(e => {
    document.getElementById('msg').innerHTML = 'לא הצלחנו לטעון את לוח הניהול.<br><small>' +
      String(e.message || e).replace(/</g, '&lt;') + '</small><br><button onclick="location.reload()">לנסות שוב</button>';
  });
</script>
</body>
</html>
